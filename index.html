<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
</head>
<body style="
    background-color: #f7e6e9; /* Light pink/lavender background */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: sans-serif;
    text-align: center;
">

    <img src="hug.gif" alt="A surprise or heart-themed GIF" style="
        /* Fixed size for the GIF, positioned above the heading */
        width: 120px; 
        height: auto;
        margin-bottom: 25px; /* Space between the GIF and the heading */
        border-radius: 10px; /* Optional: adds soft corners */
    ">

    <h1 style="
        font-size: 3rem;
        color: #ff69b4; /* Hot pink color */
        text-shadow: 2px 2px 0 #fff; /* White shadow for a raised effect */
        margin-bottom: 20px;
        letter-spacing: 2px;
        /* Note: For the exact script font, you'd need to use a custom font,
             but sans-serif is used here as a standard substitute. */
    ">Hi my love!</h1>

    <p style="
        font-size: 1.5rem;
        color: #800080; /* Purple color for the question */
        margin-bottom: 50px;
        letter-spacing: 1px;
        font-weight: 500;
    ">READY FOR A SURPRISE?</p>

    <a href="https://troymrnd.github.io/yes/" style="
        display: block;
        text-decoration: none;
        padding: 15px 50px;
        margin-bottom: 20px;
        border-radius: 40px;
        font-size: 1.4rem;
        font-weight: bold;
        color: #800080; /* Purple text */
        background-color: #fff0f5; /* Very light pink/white background */
        border: 4px solid #ffb6c1; /* Light pink border */
        box-shadow: 0 0 10px rgba(255, 105, 180, 0.7); /* Hot pink glow/shadow */
        transition: all 0.3s ease;
    ">SURE!</a>

    <a href="https://troymrnd.github.io/no1/" style="
        display: block;
        text-decoration: none;
        padding: 15px 50px;
        border-radius: 40px;
        font-size: 1.4rem;
        font-weight: bold;
        color: #800080; /* Purple text */
        background-color: #fff0f5; /* Very light pink/white background */
        border: 4px solid #ffb6c1; /* Light pink border */
        box-shadow: 0 0 10px rgba(255, 105, 180, 0.7); /* Hot pink glow/shadow */
        transition: all 0.3s ease;
    ">NAH</a>

</body>

</html>
